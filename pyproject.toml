[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae-device-pi"
version = "0.9.3"
description = "Raspberry Pi client for Tesserae: paints packed .bin or PNG frames onto a Pimoroni Inky e-ink panel, over REST, MQTT or the cloud relay."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Tesserae" }]
keywords = ["tesserae", "e-ink", "e-paper", "raspberry-pi", "inky"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "paho-mqtt>=2.0,<3",
    "Pillow>=10,<12",
    # paint.py unpacks a packed .bin frame into inky's buf with numpy. inky
    # depends on it too; listed because we import it directly.
    "numpy>=1.24",
    # transports/rest.py uses requests for HTTP polling. inky already pulls
    # it transitively today, but list it explicitly so the dep tree doesn't
    # depend on inky's chain to satisfy a module we import directly.
    "requests>=2.31",
    # A range, not a pin: a packed frame is written to the driver's buf only
    # when the driver has one, else it goes through set_image (paint.py).
    "inky[rpi]>=2.0,<3",
    # relay_crypto.py: X25519 + HKDF-SHA256 + AES-256-GCM for the cloud-relay
    # transport, pinned to docs/relay/contract.md's golden vectors.
    "cryptography>=42",
    # screens.py: the QR code to the LAN settings page. Pure Python, no deps.
    "segno>=1.5",
]

[project.urls]
Homepage = "https://tesserae.ink"
Source = "https://github.com/dmellok/tesserae-device-pi"
Issues = "https://github.com/dmellok/tesserae-device-pi/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tesserae-device-pi = "tesserae_device_pi.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
# Contract modules — strict.
module = [
    "tesserae_device_pi.config",
    "tesserae_device_pi.frame",
    "tesserae_device_pi.lan",
    "tesserae_device_pi.ota_apply",
    "tesserae_device_pi.ota_guard",
    "tesserae_device_pi.diagnostics",
    "tesserae_device_pi.migrate",
    "tesserae_device_pi.transforms",
    "tesserae_device_pi.heartbeat",
    "tesserae_device_pi.mqtt_loop",
    "tesserae_device_pi.transports.rest",
    # Added for firmware parity — same bar as the rest.
    "tesserae_device_pi.button_report",
    "tesserae_device_pi.collection",
    "tesserae_device_pi.deck",
    "tesserae_device_pi.frame_cache",
    "tesserae_device_pi.ota_log",
    "tesserae_device_pi.ota_report",
    "tesserae_device_pi.png_frame",
    "tesserae_device_pi.relay_crypto",
    "tesserae_device_pi.transports.sse",
]
strict = true

[[tool.mypy.overrides]]
# Hardware-touching paths — defaults.
module = [
    "tesserae_device_pi.paint",
    "tesserae_device_pi.main",
    "tesserae_device_pi.buttons",
    "tesserae_device_pi.environment",
    "tesserae_device_pi.transports.mqtt",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Imported lazily and only on a Pi; none of them ship stubs.
module = [
    "paho.*", "inky.*", "PIL.*", "requests.*",
    "gpiod.*", "gpiodevice.*", "smbus2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
