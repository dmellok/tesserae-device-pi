[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesserae-pi-client"
version = "0.9.0"
description = "Raspberry Pi client for Tesserae: paints packed .bin or PNG frames onto a Pimoroni Inky e-ink panel, over REST, MQTT or the cloud relay."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Tesserae" }]
dependencies = [
    "paho-mqtt>=2.0,<3",
    "Pillow>=10,<12",
    # paint.py unpacks a packed .bin frame into inky's buf with numpy. inky
    # depends on it too; listed because we import it directly.
    "numpy>=1.24",
    # transports/rest.py uses requests for HTTP polling. inky already pulls
    # it transitively today, but list it explicitly so the dep tree doesn't
    # depend on inky's chain to satisfy a module we import directly.
    "requests>=2.31",
    # A range, not a pin: a packed frame is written to the driver's buf only
    # when the driver has one, else it goes through set_image (paint.py).
    "inky[rpi]>=2.0,<3",
    # relay_crypto.py: X25519 + HKDF-SHA256 + AES-256-GCM for the cloud-relay
    # transport, pinned to docs/relay/contract.md's golden vectors.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
tesserae-pi-client = "tesserae_pi_client.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
# Contract modules — strict.
module = [
    "tesserae_pi_client.config",
    "tesserae_pi_client.frame",
    "tesserae_pi_client.migrate",
    "tesserae_pi_client.transforms",
    "tesserae_pi_client.heartbeat",
    "tesserae_pi_client.mqtt_loop",
    "tesserae_pi_client.transports.rest",
    # Added for firmware parity — same bar as the rest.
    "tesserae_pi_client.button_report",
    "tesserae_pi_client.collection",
    "tesserae_pi_client.deck",
    "tesserae_pi_client.frame_cache",
    "tesserae_pi_client.ota_report",
    "tesserae_pi_client.png_frame",
    "tesserae_pi_client.relay_crypto",
    "tesserae_pi_client.transports.sse",
]
strict = true

[[tool.mypy.overrides]]
# Hardware-touching paths — defaults.
module = [
    "tesserae_pi_client.paint",
    "tesserae_pi_client.main",
    "tesserae_pi_client.buttons",
    "tesserae_pi_client.environment",
    "tesserae_pi_client.transports.mqtt",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Imported lazily and only on a Pi; none of them ship stubs.
module = [
    "paho.*", "inky.*", "PIL.*", "requests.*",
    "gpiod.*", "gpiodevice.*", "smbus2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
